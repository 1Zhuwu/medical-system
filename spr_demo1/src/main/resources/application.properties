spring.application.name=spr_demo1

# ---------------- 服务端口 ----------------
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ---------------- 数据源（按自己本机 MySQL 修改账号密码与端口） ----------------
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/medical_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
# 真实密码不要写进本文件（会被提交到公开仓库），统一放在 application-local.properties
spring.datasource.password=${DB_PASSWORD:123456}

# 加载本地私有配置（该文件已在 .gitignore 中，不会被提交）；文件不存在时自动跳过
spring.config.import=optional:classpath:/application-local.properties

# HikariCP 连接池
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000

# ---------------- MyBatis-Plus ----------------
# 下划线转驼峰：dept_name -> deptName
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 控制台打印 SQL，实验报告截图需要；上线可换成 Slf4j 实现
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# 主键策略：数据库自增
mybatis-plus.global-config.db-config.id-type=auto
# 逻辑删除
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0
# 自定义 XML 的位置（当前全部用 Wrapper，暂无 XML，留着备用）
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml

# ---------------- Jackson ----------------
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8
