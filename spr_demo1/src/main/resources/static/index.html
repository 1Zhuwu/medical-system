<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>医疗挂号系统</title>
</head>
<body>

<h1>医疗挂号系统</h1>

<ul>
    <li><a href="/hello">/hello</a> —— HelloWorld 测试接口</li>
    <li><a href="/api/departments">/api/departments</a> —— 科室分页查询</li>
    <li><a href="/api/doctors">/api/doctors</a> —— 医生分页查询（带科室名称）</li>
    <li><a href="/api/patients">/api/patients</a> —— 患者分页查询（手机号、身份证脱敏）</li>
</ul>

<p>可以带参数，例如：</p>
<ul>
    <li><a href="/api/departments?pageNum=1&amp;pageSize=3">/api/departments?pageNum=1&amp;pageSize=3</a></li>
    <li><a href="/api/departments?keyword=内">/api/departments?keyword=内</a></li>
    <li><a href="/api/doctors?deptId=1">/api/doctors?deptId=1</a></li>
</ul>

<p>返回格式：code 状态码，message 提示信息，data 业务数据。</p>

</body>
</html>
